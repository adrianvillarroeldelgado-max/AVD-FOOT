<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Pie y Gemelos</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --accent:#16a34a; --accent-ink:#ffffff; --warn:#b45309; --chip:#eef2f7; --match:#dc2626;
  --p-base:#0ea5e9; --p-dev:#16a34a; --p-deload:#a855f7; --p-maint:#f59e0b;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b1120; --card:#131c2e; --ink:#e5e7eb; --muted:#94a3b8; --line:#23304a;
    --accent:#22c55e; --accent-ink:#04120a; --warn:#f59e0b; --chip:#1c2740; --match:#f87171;
    --p-base:#38bdf8; --p-dev:#22c55e; --p-deload:#c084fc; --p-maint:#fbbf24; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
header{padding:20px 16px 8px;max-width:760px;margin:auto}
h1{font-size:1.4rem;margin:0}
header p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.start{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.88rem;color:var(--muted);flex-wrap:wrap}
.start input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.bar{display:flex;gap:8px;margin-top:10px}
.bar button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
.bar button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:760px;margin:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 10px;font:inherit;font-size:.85rem;cursor:pointer;text-align:center;min-width:52px}
.strip button small{display:block;color:var(--muted);font-size:.7rem}
.strip button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.strip button.on small{color:var(--bg);opacity:.75}
.strip button.match{border-color:var(--match)}
.strip button.past{opacity:.55}
.weeks button{border-bottom-width:3px}
.weeks{padding-bottom:0}
main{max-width:760px;margin:auto;padding:12px 16px}
.phase{border-radius:14px;padding:12px 14px;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pc)}
.phase b{color:var(--pc)}
.phase p{margin:4px 0 0;font-size:.9rem;color:var(--muted)}
.phase .next{font-size:.82rem}
.timeline{display:flex;gap:3px;margin-top:10px;height:8px}
.timeline span{flex:1;border-radius:3px;opacity:.3}
.timeline span.cur{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dayhead h2{margin:4px 0 2px;font-size:1.2rem}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.focus{color:var(--muted);margin:0 0 12px;font-size:.92rem}
.progress{height:6px;background:var(--chip);border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card.done{opacity:.6}
.row{display:flex;gap:10px;align-items:flex-start}
.row input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
.card h3{margin:0;font-size:1.02rem}
.target{color:var(--muted);font-size:.8rem}
.dose{margin:8px 0 0;font-weight:600}
.note{margin:4px 0 0;color:var(--warn);font-size:.85rem}
details{margin-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:.88rem}
ul{margin:6px 0 0;padding-left:20px}
li{margin:2px 0;font-size:.92rem}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.links a{font-size:.82rem;text-decoration:none;color:var(--ink);background:var(--chip);padding:5px 10px;border-radius:99px}
.links a.yt{opacity:.8}
.timer{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timer button{border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;padding:7px 14px;border-radius:10px;cursor:pointer}
.timer button.stop{background:var(--chip);color:var(--ink)}
.timer output{font-variant-numeric:tabular-nums;font-size:.95rem}
.field{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;align-items:center;font-size:.9rem}
.field input{width:76px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.field span{color:var(--muted)}
.info{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:20px;font-size:.92rem}
.info h3{margin:0 0 6px;font-size:1rem}
.info p{margin:6px 0}
.reset{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer;margin-top:8px}
/* calendario */
.cal h2{font-size:1.15rem;margin:4px 0 4px}
.cal .sub{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.cycle{margin:16px 0 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.wk{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer;width:100%;text-align:left;font:inherit;color:var(--ink)}
.wk.cur{outline:2px solid var(--ink)}
.wk.past{opacity:.6}
.wk .n{font-weight:700;min-width:34px}
.wk .mid{flex:1;min-width:0}
.wk .mid div{font-size:.8rem;color:var(--muted)}
.wk .pct{font-size:.8rem;color:var(--muted);text-align:right;white-space:nowrap}
.wk .mini{display:block;height:4px;width:54px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:4px}
.wk .mini i{display:block;height:100%;background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:6px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:.8rem}
.more{display:block;margin:10px auto 0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Pie y Gemelos ⚽</h1>
  <p>Arco, equilibrio y gemelos/sóleo con isométricos · partido los sábados</p>
  <label class="start">Inicio del plan <input type="date" id="start"> <span id="weeknow"></span></label>
  <div class="bar">
    <button id="btnHoy">Hoy</button>
    <button id="btnPlan">Rutina</button>
    <button id="btnCal">📅 Calendario</button>
  </div>
</header>
<nav id="nav">
  <div class="strip weeks" id="weeks"></div>
  <div class="strip" id="days"></div>
</nav>
<main id="main"></main>

<script>
/* ---------- EJERCICIOS ---------- */
const EX = {
  masaje:{
    name:"Masaje plantar con pelota", target:"Fascia plantar · preparación",
    cues:["Sentado, pelota de tenis o lacrosse bajo el arco","Rueda del talón a la base del dedo gordo","Presión cómoda, nunca dolor punzante"],
    videos:[["Physitrack · ball roll","https://au.physitrack.com/home-exercise-video/plantar-fascia-ball-roll"],
            ["Physitrack · liberación miofascial","https://ca.physitrack.com/home-exercise-video/plantar-fascia-self-myofascial-release-with-a-ball"]],
    yt:"masaje fascia plantar pelota de tenis"
  },
  pieCorto:{
    name:"Pie corto (short foot)", target:"Abductor del hallux · intrínsecos · arco",
    cues:["Descalzo. Acorta el pie llevando la base del dedo gordo hacia el talón","El arco sube; los dedos NO se encogen ni se despegan","Progresión: sentado → de pie → a una pierna"],
    videos:[["Prehab Guys · de pie","https://theprehabguys.com/vimeo-video/standing-short-foot/"],
            ["Prehab Guys · a una pierna con banda","https://library.theprehabguys.com/vimeo-video/single-leg-short-foot-dynamic-band/"]],
    yt:"short foot exercise pie corto fisioterapia"
  },
  toeYoga:{
    name:"Toe yoga", target:"Control del dedo gordo vs. dedos menores",
    cues:["Levanta solo el dedo gordo, los otros 4 apoyados","Luego al revés: gordo abajo, levanta los otros 4","Movimiento lento; si se acalambra, para y estira"],
    videos:[["Podólogo · toe yoga (YouTube)","https://www.youtube.com/watch?v=6kFBwwZNmR8"]],
    yt:"toe yoga ejercicios dedos pie"
  },
  equilibrio:{
    name:"Equilibrio a una pierna", target:"Propiocepción de tobillo",
    cues:["Mantén el pie corto activo durante todo el apoyo","Rodilla suave, pelvis nivelada","Progresión: ojos cerrados → cojín/BOSU → giros de cabeza → pases de balón"],
    videos:[["Physitrack · single leg balance","https://nz.physitrack.com/home-exercise-video/single-leg-balance"],
            ["Prehab Guys · progresiones BOSU","https://theprehabguys.com/vimeo-tag/balance/page/8/"]],
    yt:"single leg balance progression ankle"
  },
  talonPelota:{
    name:"Elevación de talón con pelota entre talones", target:"Gemelos + tibial posterior · anti-pronación",
    cues:["Pelota de tenis entre los talones, apriétala todo el rato","Sube recto sobre el dedo gordo, sin irte al borde externo","Baja en 3 segundos"],
    videos:[["Prehab Guys · ball squeeze","https://library.theprehabguys.com/vimeo-video/heel-raise-ball-squeeze/"],
            ["Physitrack · resisted inversion","https://au.physitrack.com/home-exercise-video/calf-raise-with-resisted-inversion"]],
    yt:"calf raise ball between heels"
  },
  isoGemelo:{
    name:"Isométrico de gemelo · rodilla recta", target:"Gastrocnemio (gemelos)",
    cues:["Una pierna, rodilla bloqueada, manos en la pared","Talón a media altura o con el talón al nivel del escalón (posición alargada = más estímulo)","Peso sobre el dedo gordo, tobillo sin rodar hacia fuera","Carga: mochila o mancuerna según la fase"],
    videos:[["Physitrack · gastrocnemius bias","https://us.physitrack.com/home-exercise-video/isometric-single-leg-heel-raise---gastrocnemius-bias"],
            ["Prehab Guys · isométrico con banda (sin carga)","https://library.theprehabguys.com/vimeo-video/seated-calf-isometrics-strap-2/"]],
    yt:"isometric single leg calf raise hold straight knee"
  },
  isoSoleo:{
    name:"Isométrico de sóleo · rodilla flexionada", target:"Sóleo",
    cues:["Una pierna, rodilla doblada ~30–45°, talón elevado","No dejes que la rodilla se estire durante la serie","Sin equipo: empuja hacia arriba contra el marco de una puerta (ver 2º video)"],
    videos:[["Physitrack · soleus bias","https://us.physitrack.com/home-exercise-video/isometric-single-leg-heel-raise---soleus-bias"],
            ["Physitrack · contra marco de puerta","https://us.physitrack.com/home-exercise-video/isometric-soleus-contraction-in-standing"],
            ["Prehab Guys · rodilla flexionada alterno","https://library.theprehabguys.com/vimeo-video/heel-raise-isometrics-knee-bent-alternating-wall-supported/"]],
    yt:"isometric soleus hold bent knee"
  },
  soleoBarra:{
    name:"Isométrico de sóleo sentado con barra (gimnasio)", target:"Sóleo · alta carga",
    cues:["Barra en el rack a la altura de las rodillas, sentado en banco","Empuja con la punta de los pies como si quisieras levantar la barra","Carga alta: debes llegar al final de la serie con esfuerzo 8–9/10"],
    videos:[["Physitrack · seated soleus barbell","https://us.physitrack.com/home-exercise-video/isometric-seated-soleus-calf-raise-with-barbell"]],
    yt:"isometric seated soleus barbell"
  },
  dinamico:{
    name:"Elevación de talón lenta en escalón (rango completo)", target:"Gemelos + sóleo · complemento de hipertrofia",
    cues:["Una pierna, antepié en el borde del escalón, mano en la pared","Baja hasta sentir estiramiento, pausa 1 s abajo","Sube en 2 s, baja en 3 s. Sin rebotes"],
    videos:[["Physitrack · single-leg on step","https://uk.physitrack.com/home-exercise-video/single-leg-calf-raise-on-step-with-support"]],
    yt:"single leg calf raise on step full range slow"
  },
  test:{
    name:"Test: elevaciones a una pierna", target:"Medir el progreso",
    cues:["En escalón, rodilla recta, ritmo de metrónomo (1 rep cada 2 s)","Cuenta repeticiones completas hasta que no puedas subir del todo","Haz el test descansado, antes de los isométricos"],
    videos:[["Physitrack · single-leg on step","https://uk.physitrack.com/home-exercise-video/single-leg-calf-raise-on-step-with-support"]],
    yt:"single leg calf raise test"
  }
};

/* ---------- PROGRAMACIÓN ----------
   Semanas 1–10: fase inicial de desarrollo.
   Semana 11 en adelante: ciclos de 8 semanas que se repiten siempre:
   4 Mantenimiento → 3 Refuerzo (+2,5 kg) → 1 Descarga + test.            */
const INITIAL = [
  { id:"base", label:"Base", from:1, to:2, color:"var(--p-base)",
    desc:"Aprende la técnica y despierta el pie. Peso corporal, sin buscar el fallo.",
    pc:"3 × 8 reps · 5–10 s · sentado → de pie", bal:"suelo firme", talon:"2 × 10, bajada en 3 s",
    heavy:{sets:3, secs:"30", t:30, rpe:"7/10", rest:60}, loadRule:"bw",
    mod:{sets:2, secs:"20", t:20, rpe:"6/10"} },
  { id:"dev1", label:"Desarrollo I", from:3, to:5, color:"var(--p-dev)",
    desc:"Más tiempo bajo tensión y primera carga. Cuando completes todas las series a 45 s, añade 2,5–5 kg.",
    pc:"3 × 10 reps · 10 s · de pie", bal:"ojos cerrados", talon:"3 × 12, bajada en 3 s",
    heavy:{sets:4, secs:"45", t:45, rpe:"8/10", rest:75}, loadRule:"start", startLoad:"peso corporal → mochila 5–10 kg",
    mod:{sets:3, secs:"30", t:30, rpe:"7/10"} },
  { id:"deload", label:"Descarga", from:6, to:6, color:"var(--p-deload)",
    desc:"Mitad de volumen, misma carga. Aquí el músculo asimila lo trabajado.",
    pc:"2 × 8 reps · 10 s · de pie", bal:"ojos cerrados", talon:"2 × 10",
    heavy:{sets:2, secs:"30", t:30, rpe:"7/10", rest:75}, loadRule:"keep", mod:null },
  { id:"dev2", label:"Desarrollo II", from:7, to:9, color:"var(--p-dev)",
    desc:"Carga alta en posición alargada + trabajo dinámico. La fase que más tamaño aporta.",
    pc:"3 × 8 reps · 10 s · a una pierna", bal:"cojín/BOSU + pases de balón", talon:"3 × 12, bajada en 3 s",
    heavy:{sets:5, secs:"30–45", t:40, rpe:"8–9/10", rest:90}, loadRule:"up",
    mod:{sets:3, secs:"30", t:30, rpe:"7/10"}, barra:true, dyn:"3 × 10–15 lentas" },
  { id:"deloadT", label:"Descarga + test", from:10, to:10, color:"var(--p-deload)",
    desc:"Descarga y test. Compara con la semana 1. Desde la próxima semana entras en los ciclos continuos.",
    pc:"2 × 8 reps · 10 s · a una pierna", bal:"cojín/BOSU", talon:"2 × 10",
    heavy:{sets:2, secs:"30", t:30, rpe:"7/10", rest:90}, loadRule:"keep", mod:null, test:true }
];
const CYCLE = [
  { id:"maint", label:"Mantenimiento", weeks:4, color:"var(--p-maint)",
    desc:"Conserva lo ganado con 1 sesión dura por semana con tu última carga. El jueves es solo pie.",
    pc:"2 × 8 reps · 10 s · a una pierna", bal:"BOSU + pases de balón", talon:"2 × 12",
    heavy:{sets:3, secs:"30–45", t:40, rpe:"8/10", rest:90}, loadRule:"keep", mod:null, dyn:"2 × 12 lentas", light:true },
  { id:"boost", label:"Refuerzo", weeks:3, color:"var(--p-dev)",
    desc:"Bloque de progresión: +2,5 kg sobre tu última carga y vuelven 2 días de gemelos. Aquí sigues ganando tamaño.",
    pc:"3 × 8 reps · 10 s · a una pierna", bal:"BOSU + pases de balón", talon:"3 × 12, bajada en 3 s",
    heavy:{sets:5, secs:"30–45", t:40, rpe:"8–9/10", rest:90}, loadRule:"up",
    mod:{sets:3, secs:"30", t:30, rpe:"7/10"}, barra:true, dyn:"3 × 10–15 lentas" },
  { id:"deloadT", label:"Descarga + test", weeks:1, color:"var(--p-deload)",
    desc:"Mitad de volumen y test. Compara con el test anterior: si mejoraste, el próximo ciclo arranca con más carga.",
    pc:"2 × 8 reps · 10 s · a una pierna", bal:"BOSU", talon:"2 × 10",
    heavy:{sets:2, secs:"30", t:30, rpe:"7/10", rest:90}, loadRule:"keep", mod:null, test:true }
];
const CYCLE_LEN = CYCLE.reduce((a,b)=>a+b.weeks,0); // 8

function planFor(w){
  if (w <= 10){
    const p = INITIAL.find(p => w>=p.from && w<=p.to);
    return {...p, cycle:0, start:p.from, len:p.to-p.from+1, inPhase:w-p.from+1, blockStart:1, blockLen:10};
  }
  const off = w-11, cycle = Math.floor(off/CYCLE_LEN)+1, pos = off % CYCLE_LEN;
  const blockStart = 11 + (cycle-1)*CYCLE_LEN;
  let acc = 0;
  for (const b of CYCLE){
    if (pos < acc + b.weeks) return {...b, cycle, start:blockStart+acc, len:b.weeks, inPhase:pos-acc+1, blockStart, blockLen:CYCLE_LEN};
    acc += b.weeks;
  }
}
const isTestWeek = w => w===1 || !!planFor(w).test;

/* ---------- ESTADO ---------- */
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = (()=>{ const d=new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); })();
const fmtShort = d => d.toLocaleDateString("es", {day:"numeric", month:"short"}).replace(".","");

let startStr = store.get("planStart");
if(!startStr){ startStr = ymd(today); store.set("planStart", startStr); }
function weekZero(){ // domingo de la semana de inicio
  const [y,m,d] = startStr.split("-").map(Number);
  const s = new Date(y, m-1, d); s.setDate(s.getDate() - s.getDay()); return s;
}
function currentWeek(){ const days = Math.round((today - weekZero()) / 864e5); return Math.max(1, Math.floor(days/7) + 1); }
function dateOf(wk, dayIdx){ const d = weekZero(); d.setDate(d.getDate() + (wk-1)*7 + dayIdx); return d; }
const weekRange = w => `${fmtShort(dateOf(w,0))} – ${fmtShort(dateOf(w,6))}`;

/* carga registrada (kg) por semana */
const loads = () => store.get("loads") || {};
function lastLoad(beforeW){
  const L = loads();
  for (let i = beforeW-1; i >= 1; i--) if (L[i] != null && L[i] !== "") return {w:i, kg:+L[i]};
  return null;
}
function loadText(p, w){
  const last = lastLoad(w);
  const r = n => (Math.round(n*2)/2).toString().replace(".",",");
  switch(p.loadRule){
    case "bw": return "peso corporal";
    case "start": return last ? `${r(last.kg)} kg (sube 2,5 kg si hiciste todo a 45 s)` : p.startLoad;
    case "up":
      if (!last) return "+2,5 kg sobre tu última carga (regístrala abajo)";
      return (last.w >= p.start) ? `${r(last.kg)} kg (o +2,5 kg si fue fácil)` : `${r(last.kg+2.5)} kg (última ${r(last.kg)} + 2,5)`;
    default: return last ? `${r(last.kg)} kg (tu última carga)` : "tu carga habitual";
  }
}

let selWeek = currentWeek(), selDay = today.getDay(), view = "plan", calLimit = 0;

/* ---------- PLANTILLA SEMANAL (MD = sábado) ---------- */
function buildWeek(w){
  const p = planFor(w), h = p.heavy, perLeg = true;
  const heavyDose = `${h.sets} × ${h.secs} s por pierna · esfuerzo ${h.rpe} · ${loadText(p,w)}`;
  const tues = [{ex:"pieCorto", dose:"2 × 5 reps · 10 s (activación)"}];
  if (isTestWeek(w)) tues.push({ex:"test", dose:"1 serie máxima por pierna", test:true});
  tues.push(
    {ex:"isoGemelo", dose:heavyDose, note:`Descanso ${h.rest} s`, t:{sets:h.sets,work:h.t,rest:h.rest,perLeg}, loadLog:p.loadRule!=="bw"},
    {ex:"isoSoleo", dose:heavyDose, note:p.barra?"Si vas al gimnasio, cámbialo por el sóleo sentado con barra":"", t:{sets:h.sets,work:h.t,rest:h.rest,perLeg}}
  );
  if (p.barra) tues.push({ex:"soleoBarra", dose:`Opcional (gimnasio): ${h.sets-1} × 30–45 s · esfuerzo ${h.rpe}`, t:{sets:h.sets-1,work:h.t,rest:h.rest,perLeg:false}});
  if (p.dyn) tues.push({ex:"dinamico", dose:`${p.dyn} por pierna`});
  tues.push({ex:"equilibrio", dose:`2 × 30 s por pierna · ${p.bal}`, t:{sets:2,work:30,rest:20,perLeg}});

  const thu = p.mod
    ? { title:"Gemelos MODERADO", focus:"Mitad de volumen que el martes. Termina cada serie con margen: nada al fallo.",
        items:[
          {ex:"isoGemelo", dose:`${p.mod.sets} × ${p.mod.secs} s por pierna · esfuerzo ${p.mod.rpe}`, t:{sets:p.mod.sets,work:p.mod.t,rest:60,perLeg}},
          {ex:"isoSoleo", dose:`${p.mod.sets} × ${p.mod.secs} s por pierna · esfuerzo ${p.mod.rpe}`, t:{sets:p.mod.sets,work:p.mod.t,rest:60,perLeg}},
          {ex:"pieCorto", dose:"2 × 8 reps · 5–10 s"} ]}
    : { title:"Pie ligero", focus:"Sin gemelos pesados esta semana. Solo mantener el pie activo.",
        items:[ {ex:"pieCorto", dose:"2 × 8 reps · 5–10 s"}, {ex:"toeYoga", dose:"1 × 10 en cada dirección"} ]};

  const wed = p.light
    ? { title:"Pie + control", focus:"Versión corta de mantenimiento.",
        items:[ {ex:"pieCorto", dose:p.pc, note:"Serie extra con el izquierdo"},
                {ex:"equilibrio", dose:`2 × 30 s · ${p.bal}`, t:{sets:2,work:30,rest:20,perLeg}} ]}
    : { title:"Pie + control", focus:"Día de entreno de equipo típico. Trabajo de pie, sin fatigar gemelos.",
        items:[ {ex:"pieCorto", dose:p.pc, note:"Serie extra con el izquierdo"},
                {ex:"toeYoga", dose:"2 × 10 en cada dirección"},
                {ex:"equilibrio", dose:`3 × 30 s · ${p.bal}`, t:{sets:3,work:30,rest:20,perLeg}},
                {ex:"talonPelota", dose:p.talon} ]};

  return [
    { d:"Dom", md:"MD+1", title:"Recuperación", focus:"Solo descarga. Nada de gemelos pesados tras el partido.",
      items:[ {ex:"masaje", dose:"1–2 min por pie"}, {ex:"toeYoga", dose:"1 × 10 en cada dirección"},
              {ex:"equilibrio", dose:"2 × 30 s por pierna, suelo firme", t:{sets:2,work:30,rest:15,perLeg}} ]},
    { d:"Lun", md:"MD+2", title:"Pie y equilibrio", focus:"Volumen de pie. Los gemelos descansan para mañana.",
      items:[ {ex:"masaje", dose:"1 min por pie"}, {ex:"pieCorto", dose:p.pc, note:"Haz 1 serie extra con el pie izquierdo"},
              {ex:"toeYoga", dose:"2 × 10 en cada dirección"},
              {ex:"equilibrio", dose:`3 × 30 s por pierna · ${p.bal}`, t:{sets:3,work:30,rest:20,perLeg}},
              {ex:"talonPelota", dose:p.talon} ]},
    { d:"Mar", md:"MD-4", title: p.id.startsWith("deload") ? "Gemelos (descarga)" : (p.id==="maint" ? "Gemelos · sesión de mantenimiento" : "Gemelos FUERTE 💪"),
      focus: isTestWeek(w) ? "Semana de test: haz el test primero, descansado." : "Día principal de gemelos, lejos del partido.", items:tues },
    { d:"Mié", md:"MD-3", ...wed },
    { d:"Jue", md:"MD-2", ...thu },
    { d:"Vie", md:"MD-1", title:"Activación", focus:"5 minutos. Solo despertar el pie, cero fatiga.",
      items:[ {ex:"masaje", dose:"1 min por pie"}, {ex:"pieCorto", dose:"2 × 5 reps · 5 s"},
              {ex:"equilibrio", dose:"2 × 20 s por pierna", t:{sets:2,work:20,rest:15,perLeg}} ]},
    { d:"Sáb", md:"MD", title:"Partido ⚽", focus:"Mételo en el calentamiento, antes de los sprints.",
      items:[ {ex:"pieCorto", dose:"1 × 5 reps de pie · 5 s"},
              {ex:"isoGemelo", dose:"2 × 15 s por pierna · esfuerzo 6/10", t:{sets:2,work:15,rest:15,perLeg}},
              {ex:"equilibrio", dose:"1 × 20 s por pierna", t:{sets:1,work:20,rest:10,perLeg}} ]}
  ];
}
function weekCompletion(w){
  const wk = buildWeek(w); let tot=0, ok=0;
  wk.forEach((day,i)=>{ const d = store.get("done-"+ymd(dateOf(w,i))) || {}; tot += day.items.length; day.items.forEach((_,j)=>{ if(d[j]) ok++; }); });
  return tot ? ok/tot : 0;
}

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const phaseTitle = p => p.cycle ? `Ciclo ${p.cycle} · ${p.label}` : `Fase inicial · ${p.label}`;
$("start").value = startStr;
$("start").onchange = e => { if(!e.target.value) return; startStr = e.target.value; store.set("planStart", startStr);
  selWeek = currentWeek(); stopTimer(); render(); };
$("btnHoy").onclick = () => { view="plan"; selWeek=currentWeek(); selDay=today.getDay(); stopTimer(); render(); };
$("btnPlan").onclick = () => { view="plan"; stopTimer(); render(); };
$("btnCal").onclick = () => { view="cal"; stopTimer(); render(); };

function renderWeeks(){
  const cw = currentWeek(), last = Math.max(cw + 8, selWeek + 2, 18);
  let html = "";
  for (let w=1; w<=last; w++){
    const p = planFor(w);
    html += `<button class="${w===selWeek?'on':''} ${w<cw?'past':''}" data-w="${w}" style="border-bottom-color:${p.color}">S${w}${w===cw?' •':''}<small>${fmtShort(dateOf(w,0))}</small></button>`;
  }
  $("weeks").innerHTML = html;
  $("weeks").querySelectorAll("button").forEach(b=>b.onclick=()=>{ selWeek=+b.dataset.w; stopTimer(); render(); });
  const on = $("weeks").querySelector(".on"); on && on.scrollIntoView({inline:"center", block:"nearest"});
}
function renderDays(week){
  const isThisWeek = selWeek === currentWeek();
  $("days").innerHTML = week.map((w,i)=>`<button class="${i===selDay?'on':''} ${w.md==='MD'?'match':''}" data-i="${i}">${w.d}${isThisWeek&&i===today.getDay()?' •':''}<small>${fmtShort(dateOf(selWeek,i))}</small></button>`).join("");
  $("days").querySelectorAll("button").forEach(b=>b.onclick=()=>{ selDay=+b.dataset.i; stopTimer(); render(); });
}
function renderHeader(){
  const cw = currentWeek(), p = planFor(cw);
  $("weeknow").textContent = `· hoy: semana ${cw} · ${phaseTitle(p)}`;
  $("btnPlan").classList.toggle("on", view==="plan");
  $("btnCal").classList.toggle("on", view==="cal");
  $("nav").style.display = view==="plan" ? "" : "none";
}

function render(){ renderHeader(); view==="cal" ? renderCal() : renderPlan(); }

function renderPlan(){
  const p = planFor(selWeek), week = buildWeek(selWeek), w = week[selDay];
  renderWeeks(); renderDays(week);
  const date = dateOf(selWeek, selDay), key = "done-" + ymd(date), done = store.get(key) || {};
  const n = w.items.length, k = w.items.filter((_,i)=>done[i]).length;
  let tl = ""; for (let i=0;i<p.blockLen;i++){ const ww=p.blockStart+i; tl += `<span class="${ww===selWeek?'cur':''}" style="background:${planFor(ww).color}" title="S${ww} · ${esc(planFor(ww).label)}"></span>`; }
  const nextW = p.start + p.len, np = planFor(nextW);
  const res = store.get("test-results") || {}, L = loads();
  const fmtDate = date.toLocaleDateString("es", {weekday:"long", day:"numeric", month:"short"});
  const prevTest = (()=>{ for(let i=selWeek-1;i>=1;i--) if(res[i+'-L']!=null) return i; return null; })();

  $("main").innerHTML = `
    <div class="phase" style="--pc:${p.color}">
      <b>${esc(phaseTitle(p))}</b> · semana ${p.inPhase} de ${p.len}
      <p>${esc(p.desc)}</p>
      <p class="next">Siguiente: <b style="color:${np.color}">${esc(np.label)}</b> desde el ${fmtShort(dateOf(nextW,0))} (S${nextW})</p>
      <div class="timeline">${tl}</div>
    </div>
    <div class="dayhead"><h2>${esc(w.title)}</h2><span class="tag">S${selWeek} · ${w.md} · ${esc(fmtDate)}</span></div>
    <p class="focus">${esc(w.focus)}</p>
    <div class="progress"><i style="width:${n?k/n*100:0}%"></i></div>
    ${w.items.map((it,i)=>{
      const e = EX[it.ex];
      const ll = lastLoad(selWeek);
      return `<div class="card ${done[i]?'done':''}">
        <div class="row">
          <input type="checkbox" data-i="${i}" ${done[i]?'checked':''} aria-label="Hecho">
          <div style="flex:1">
            <h3>${esc(e.name)}</h3><div class="target">${esc(e.target)}</div>
            <p class="dose">${esc(it.dose)}</p>
            ${it.note?`<p class="note">${esc(it.note)}</p>`:''}
            <details><summary>Cómo hacerlo</summary><ul>${e.cues.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></details>
            <div class="links">
              ${e.videos.map(([l,u])=>`<a href="${u}" target="_blank" rel="noopener">▶ ${esc(l)}</a>`).join("")}
              <a class="yt" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.yt)}" target="_blank" rel="noopener">🔎 Más en YouTube</a>
            </div>
            ${it.loadLog?`<div class="field">
              <label>Carga usada esta semana <input type="number" min="0" step="0.5" inputmode="decimal" data-load="${selWeek}" value="${L[selWeek]??''}"> kg</label>
              ${ll?`<span>Última: ${ll.kg} kg (S${ll.w})</span>`:''}
            </div>`:''}
            ${it.test?`<div class="field">
              <label>Izq <input type="number" min="0" inputmode="numeric" data-test="${selWeek}-L" value="${res[selWeek+'-L']??''}"></label>
              <label>Der <input type="number" min="0" inputmode="numeric" data-test="${selWeek}-R" value="${res[selWeek+'-R']??''}"></label>
              ${prevTest?`<span>Test anterior (S${prevTest}): ${res[prevTest+'-L']} / ${res[prevTest+'-R']??'–'}</span>`:''}
            </div>`:''}
            ${it.t?`<div class="timer"><button data-t="${i}">⏱ Iniciar</button><output id="out-${i}">${it.t.sets} series × ${it.t.work}s${it.t.perLeg?' (izq + der)':''}</output></div>`:''}
          </div>
        </div></div>`;
    }).join("")}
    <div class="info">
      <h3>Cómo funciona la programación</h3>
      <p><b>Semanas 1–10 · fase inicial:</b> Base → Desarrollo I → Descarga → Desarrollo II → Descarga + test.</p>
      <p><b>Desde la semana 11 · ciclos continuos de 8 semanas</b>, sin fin: 4 Mantenimiento → 3 Refuerzo (+2,5 kg) → 1 Descarga + test.</p>
      <p>Registra cada martes la carga que usaste: la app calcula la del siguiente bloque. Mira el 📅 Calendario para ver todas las fechas.</p>
      <p>Si hay doble partido o el gemelo está cargado, convierte el martes en el día "moderado" y salta el jueves.</p>
      <p style="color:var(--muted)">Para: dolor punzante, hormigueo o dolor en el talón al levantarte → consulta a un fisioterapeuta.</p>
      <button class="reset" id="reset">Reiniciar checks de este día</button>
    </div>`;

  $("main").querySelectorAll("input[type=checkbox]").forEach(cb=>cb.onchange=()=>{
    const d = store.get(key) || {}; d[cb.dataset.i] = cb.checked; store.set(key,d); stopTimer(); render();
  });
  $("main").querySelectorAll("[data-test]").forEach(inp=>inp.onchange=()=>{
    const r = store.get("test-results") || {}; r[inp.dataset.test] = inp.value===''?null:+inp.value; store.set("test-results", r);
  });
  $("main").querySelectorAll("[data-load]").forEach(inp=>inp.onchange=()=>{
    const l = loads(); if(inp.value==='') delete l[inp.dataset.load]; else l[inp.dataset.load] = +inp.value; store.set("loads", l); render();
  });
  $("main").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>toggleTimer(+b.dataset.t, week));
  $("reset").onclick=()=>{ store.set(key,{}); render(); };
}

function renderCal(){
  const cw = currentWeek(), last = Math.max(cw + 12, 26) + calLimit;
  const res = store.get("test-results") || {}, L = loads();
  let html = `<div class="cal"><h2>Calendario</h2><p class="sub">Tu programación semana a semana desde el ${fmtShort(dateOf(1,0))}. Toca una semana para abrirla.</p>`;
  let lastGroup = null;
  for (let w=1; w<=last; w++){
    const p = planFor(w), group = p.cycle ? `Ciclo ${p.cycle} · S${p.blockStart}–S${p.blockStart+p.blockLen-1}` : "Fase inicial · S1–S10";
    if (group !== lastGroup){ html += `<div class="cycle">${group}</div>`; lastGroup = group; }
    const pct = w<=cw ? Math.round(weekCompletion(w)*100) : null;
    const extras = [isTestWeek(w)?"🧪 test":"", L[w]!=null?`${L[w]} kg`:"", res[w+'-L']!=null?`test ${res[w+'-L']}/${res[w+'-R']??'–'}`:""].filter(Boolean).join(" · ");
    html += `<button class="wk ${w===cw?'cur':''} ${w<cw?'past':''}" data-w="${w}" style="--pc:${p.color}">
      <span class="n">S${w}</span>
      <span class="mid">${esc(p.label)} <span style="color:var(--muted);font-size:.8rem">${p.inPhase}/${p.len}</span>${w===cw?' <b>· esta semana</b>':''}
        <div>${weekRange(w)}${extras?' · '+esc(extras):''}</div></span>
      <span class="pct">${pct!=null?`${pct}%<span class="mini"><i style="width:${pct}%"></i></span>`:''}</span>
    </button>`;
  }
  html += `<button class="more" id="more">Ver 12 semanas más</button>`;
  const tests = []; for (let w=1; w<=last; w++) if (res[w+'-L']!=null || res[w+'-R']!=null) tests.push(w);
  html += `<div class="info"><h3>Historial de tests</h3>${tests.length ? `<table><tr><th>Semana</th><th>Fecha</th><th>Izq</th><th>Der</th><th>Dif.</th></tr>${
    tests.map(w=>{ const a=res[w+'-L'], b=res[w+'-R']; const dif = (a!=null&&b!=null&&Math.max(a,b)>0) ? Math.round(Math.abs(a-b)/Math.max(a,b)*100)+"%" : "–";
      return `<tr><td>S${w}</td><td>${fmtShort(dateOf(w,2))}</td><td>${a??'–'}</td><td>${b??'–'}</td><td>${dif}</td></tr>`; }).join("")}</table>` :
    `<p style="color:var(--muted)">Aún no hay tests. El primero es el martes de la semana 1.</p>`}
    <p style="color:var(--muted)">Objetivo: 25+ repeticiones por pierna y diferencia izq/der menor al 10%.</p></div></div>`;
  $("main").innerHTML = html;
  $("main").querySelectorAll(".wk").forEach(b=>b.onclick=()=>{ selWeek=+b.dataset.w; selDay = selWeek===cw ? today.getDay() : 2; view="plan"; render(); window.scrollTo(0,0); });
  $("more").onclick = ()=>{ calLimit += 12; renderCal(); };
  const cur = $("main").querySelector(".wk.cur"); cur && cur.scrollIntoView({block:"center"});
}

/* ---------- TEMPORIZADOR ---------- */
let timer = null, audio = null;
function beep(f=880,ms=180){
  try{
    audio = audio || new (window.AudioContext||window.webkitAudioContext)();
    const o=audio.createOscillator(), g=audio.createGain();
    o.frequency.value=f; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(.2,audio.currentTime); o.start(); o.stop(audio.currentTime+ms/1000);
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){}
}
function stopTimer(){ if(timer){ clearInterval(timer.id); timer=null; } }
function toggleTimer(i, week){
  if(timer && timer.i===i){ stopTimer(); render(); return; }
  stopTimer(); render();
  const t = week[selDay].items[i].t, steps = [];
  for(let s=1;s<=t.sets;s++){
    const legs = t.perLeg ? ["izquierda","derecha"] : [""];
    legs.forEach((leg,li)=>{
      steps.push({label:`Serie ${s}/${t.sets}${leg?' · '+leg:''}`, secs:t.work, work:true});
      const last = s===t.sets && li===legs.length-1;
      if(!last) steps.push({label: leg && li===0 ? "Cambia de pierna" : "Descanso", secs: leg && li===0 ? 10 : t.rest, work:false});
    });
  }
  const out = $("out-"+i), b = $("main").querySelector(`[data-t="${i}"]`);
  b.textContent="■ Parar"; b.classList.add("stop");
  let k=0, left=steps[0].secs; beep(1040);
  const paint=()=>{ out.textContent = `${steps[k].work?'🔥':'😮‍💨'} ${steps[k].label} — ${left}s`; };
  paint();
  timer = { i, id: setInterval(()=>{
    left--;
    if(left<=3 && left>0) beep(660,90);
    if(left<=0){
      k++;
      if(k>=steps.length){ beep(1320,400); stopTimer(); out.textContent="✅ ¡Hecho!"; b.textContent="⏱ Repetir"; b.classList.remove("stop"); return; }
      left=steps[k].secs; beep(steps[k].work?1040:520);
    }
    paint();
  },1000)};
}

/* En el APK (Capacitor), abrir los videos en el navegador/YouTube del móvil */
if (window.Capacitor) document.addEventListener("click", e=>{
  const a = e.target.closest('a[target="_blank"]');
  if(a){ e.preventDefault(); window.location.href = a.href; }
});

render();
</script>
